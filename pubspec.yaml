name: myapp
description: "Hotel Manager App"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Versión del SDK ajustada para reflejar una versión compatible y moderna de Dart.
  # El error original sugiere un SDK más antiguo, pero si estás usando dependencias recientes,
  # es mejor usar una versión estable de la rama 3.x.
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Biblioteca para formato de fechas (CORREGIDA)
  intl: ^0.18.1

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0
  http: ^1.5.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI
  cupertino_icons: ^1.0.8
  # AÑADIDO: Paquete requerido para la funcionalidad Slidable (deslizar para acciones)
  flutter_slidable: ^3.0.1 

  # Logger for logging
  logger: ^1.1.0

  # Secure Storage for token management
  flutter_secure_storage: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 # Versión ajustada por ser más común con Flutter 3.x

flutter:
  uses-material-design: true