name: myapp
description: "Hotel Manager App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Biblioteca para formato de fechas (CORREGIDA)
  intl: ^0.18.1

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0
  http: ^1.5.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI
  cupertino_icons: ^1.0.8

  # Logger for logging
  logger: ^1.1.0

  # Secure Storage for token management
  flutter_secure_storage: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
